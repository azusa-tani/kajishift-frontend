<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5B7FA6" />
  <title>新しいパスワード設定｜KAJISHIFT</title>
  <meta name="description" content="KAJISHIFTの新しいパスワード設定ページです。" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preload" href="css/style.css" as="style" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/validation.js" defer></script>
</head>
<body class="auth-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>KAJISHIFT</h1>
        <h2>新しいパスワード設定</h2>
      </div>

      <p class="error-message">
        新しいパスワードを入力してください。パスワードは8文字以上で、英字と数字を含めてください。
      </p>

      <div id="errorMessage" class="text-error is-hidden" role="alert"></div>
      <div id="successMessage" class="text-error auth-message-success is-hidden" role="status"></div>

      <form class="login-form" id="resetPasswordForm" novalidate>
        <div class="form-group">
          <label for="password">新しいパスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            required
            autocomplete="new-password"
            aria-required="true"
            aria-describedby="password-hint" />
          <p id="password-hint" class="sr-only">8文字以上で、英字と数字を含むパスワードを入力してください</p>
        </div>

        <div class="form-group">
          <label for="passwordConfirm">新しいパスワード（確認）</label>
          <input
            type="password"
            id="passwordConfirm"
            name="passwordConfirm"
            class="form-input"
            required
            autocomplete="new-password"
            aria-required="true"
            aria-describedby="password-confirm-hint" />
          <p id="password-confirm-hint" class="sr-only">確認のため同じパスワードを入力してください</p>
        </div>

        <button type="submit" class="btn btn-primary btn-large btn-block">パスワードを変更</button>
      </form>

      <div class="login-footer">
        <a id="backToLoginLink" href="index.html">ログイン画面へ戻る</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const roleLoginPaths = {
        customer: 'customer/login.html',
        worker: 'worker/login.html',
        admin: 'admin/login.html'
      };
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const role = params.get('role');
      const backToLoginLink = document.getElementById('backToLoginLink');
      if (roleLoginPaths[role]) {
        backToLoginLink.href = roleLoginPaths[role];
      }

      const form = document.getElementById('resetPasswordForm');
      const passwordInput = document.getElementById('password');
      const passwordConfirmInput = document.getElementById('passwordConfirm');
      const submitButton = form.querySelector('button[type="submit"]');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');

      if (typeof setupRealTimeValidation === 'function' && typeof Validators !== 'undefined') {
        setupRealTimeValidation(passwordInput, Validators.password);
        setupRealTimeValidation(passwordConfirmInput, function(value) {
          return Validators.passwordConfirm(passwordInput.value, value);
        });
      }

      function showMessage(element, message) {
        element.textContent = message;
        element.classList.remove('is-hidden');
      }

      function hideMessages() {
        errorMessage.classList.add('is-hidden');
        successMessage.classList.add('is-hidden');
      }

      if (!token) {
        showMessage(errorMessage, 'パスワード再設定用のトークンが見つかりません。再度メール送信からお試しください。');
        submitButton.disabled = true;
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideMessages();

        if (!token) {
          showMessage(errorMessage, 'パスワード再設定用のトークンが見つかりません。再度メール送信からお試しください。');
          return;
        }

        const password = passwordInput.value;
        const passwordConfirm = passwordConfirmInput.value;
        const passwordError = Validators.password(password);
        const confirmError = Validators.passwordConfirm(password, passwordConfirm);

        if (passwordError) {
          showMessage(errorMessage, passwordError);
          passwordInput.focus();
          return;
        }

        if (confirmError) {
          showMessage(errorMessage, confirmError);
          passwordConfirmInput.focus();
          return;
        }

        const originalText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = '変更中...';

        try {
          await api.resetPassword(token, password);
          showMessage(successMessage, 'パスワードを変更しました。ログイン画面から新しいパスワードでログインしてください。');
          form.reset();
        } catch (error) {
          showMessage(errorMessage, error.message || 'パスワードの変更に失敗しました。リンクの有効期限をご確認ください。');
          submitButton.disabled = false;
          submitButton.textContent = originalText;
          return;
        }

        submitButton.textContent = originalText;
      });
    });
  </script>
</body>
</html>
