<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5B7FA6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KAJISHIFT" />
  <title>管理者登録｜KAJISHIFT管理画面</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="description" content="KAJISHIFT管理画面の新規登録ページ" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://kajishift.jp/admin/register.html" />
  <link rel="preload" href="../css/style.css" as="style" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/socket.js" defer></script>
</head>
<body class="admin-login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>KAJISHIFT</h1>
        <h2>管理者登録はβ版では一般利用できません</h2>
        <p>管理者アカウントの追加は、既存管理者による管理画面からのみ実施してください。</p>
      </div>
      <div class="notice-box">
        <p><strong>β版での運用:</strong> このページから管理者アカウントは作成できません。</p>
        <p>管理者を追加する場合は、既存管理者でログインし、利用者管理画面の「新しい管理者を登録」から作成してください。</p>
        <p>ログインできる管理者がいない場合は、運用担当者に管理者追加を依頼してください。</p>
      </div>
      <div class="login-footer">
        <p><a href="login.html" class="btn btn-primary btn-large btn-block">管理者ログインへ戻る</a></p>
      </div>
      <div class="login-security-note">
        <p>管理者登録APIは認証済み管理者専用です。公開登録フォームからは利用できません。</p>
      </div>
    </div>
  </div>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch((error) => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
