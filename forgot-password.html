<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5B7FA6" />
  <title>パスワード再設定｜KAJISHIFT</title>
  <meta name="description" content="KAJISHIFTのパスワード再設定メール送信ページです。" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preload" href="css/style.css" as="style" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/validation.js" defer></script>
</head>
<body class="auth-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>KAJISHIFT</h1>
        <h2>パスワード再設定</h2>
      </div>

      <p class="error-message">
        ご登録のメールアドレスを入力してください。パスワード再設定用のメールを送信します。
      </p>

      <div id="errorMessage" class="text-error is-hidden" role="alert"></div>
      <div id="successMessage" class="text-error auth-message-success is-hidden" role="status"></div>

      <form class="login-form" id="forgotPasswordForm" novalidate>
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            required
            placeholder="example@email.com"
            autocomplete="username"
            aria-required="true"
            aria-describedby="email-hint" />
          <p id="email-hint" class="sr-only">メールアドレスを入力してください</p>
        </div>

        <button type="submit" class="btn btn-primary btn-large btn-block">再設定メールを送信</button>
      </form>

      <div class="login-footer">
        <a id="backToLoginLink" href="index.html">ログイン画面へ戻る</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const roleLoginPaths = {
        customer: 'customer/login.html',
        worker: 'worker/login.html',
        admin: 'admin/login.html'
      };
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role');
      const backToLoginLink = document.getElementById('backToLoginLink');
      if (roleLoginPaths[role]) {
        backToLoginLink.href = roleLoginPaths[role];
      }

      const form = document.getElementById('forgotPasswordForm');
      const emailInput = document.getElementById('email');
      const submitButton = form.querySelector('button[type="submit"]');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');

      if (typeof setupRealTimeValidation === 'function' && typeof Validators !== 'undefined') {
        setupRealTimeValidation(emailInput, Validators.email);
      }

      function showMessage(element, message) {
        element.textContent = message;
        element.classList.remove('is-hidden');
      }

      function hideMessages() {
        errorMessage.classList.add('is-hidden');
        successMessage.classList.add('is-hidden');
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideMessages();

        const email = emailInput.value.trim();
        const emailError = Validators.email(email);
        if (emailError) {
          showMessage(errorMessage, emailError);
          emailInput.focus();
          return;
        }

        const originalText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = '送信中...';

        try {
          await api.forgotPassword(email);
          showMessage(
            successMessage,
            '該当するアカウントがある場合、パスワード再設定用のメールを送信しました。'
          );
          form.reset();
        } catch (error) {
          showMessage(errorMessage, error.message || 'メール送信に失敗しました。しばらくしてから再度お試しください。');
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = originalText;
        }
      });
    });
  </script>
</body>
</html>
